name: Build OPAL VST3

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows-vst3:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3
        shell: pwsh
        run: cmake --build build --config Release --target Opal_VST3 --parallel 2

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: OPAL-VST3-Windows
          path: build/Opal_artefacts/Release/VST3/OPAL.vst3
          if-no-files-found: error
